name: Build and test (visionOS)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i xros || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Commit generated Xcode project (main branch only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f SoundSpace.xcodeproj Config/SoundSpace-Info.plist
          git diff --cached --quiet || (git commit -m "chore: regenerate Xcode project [skip ci]" && git push)
      - name: Build for visionOS Simulator
        run: |
          set -o pipefail
          xcodebuild build -project SoundSpace.xcodeproj -scheme SoundSpace \
            -destination 'generic/platform=visionOS Simulator' CODE_SIGNING_ALLOWED=NO | tee build.log | tail -n 60
      - name: Run unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep 'Apple Vision Pro' | tail -n 1 | grep -o '[0-9A-F]\{8\}-[0-9A-F-]\{27\}' || true)
          echo "Using simulator: $UDID"
          xcodebuild test -project SoundSpace.xcodeproj -scheme SoundSpace \
            -destination "platform=visionOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO | tail -n 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
